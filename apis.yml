aid: liquidity-group
name: LIQUiDITY Group
description: >-
  LIQUiDITY Group (branded simply "Liquidity") is an AI-native private credit lender and
  alternative asset manager founded in 2018, headquartered in New York with offices in Tel Aviv,
  London, Singapore, Tokyo and Abu Dhabi. It underwrites and deploys non-dilutive debt and growth
  capital — typically $10M to $200M — to late-stage technology and mid-market companies across
  35+ countries, using its proprietary DYNAMiCs decision-science platform to compress due diligence
  from months to days. The firm manages several billion dollars across multiple debt and equity
  funds, including Mars Growth Capital, a joint venture with MUFG Bank, and is backed by MUFG,
  Apollo Asset Management, Spark Capital and Meitav Dash. Liquidity is a lender that runs on
  software rather than a software vendor: its DYNAMiCs platform is operated for its own analysts,
  borrowers and fund investors at app.liquiditygroup.com and is not offered as a public developer
  product. No public developer portal, API reference, OpenAPI/GraphQL schema, SDK or machine-readable
  contract is published on any host the company controls.
